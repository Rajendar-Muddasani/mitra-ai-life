<!DOCTYPE html>

<meta charset="UTF-8">

<title>Hindi Letters · हिंदी अक्षर</title>
<style>
:root{
  --bg:#0f172a;--surface:#1e293b;--card:#273549;
  --accent:#fbbf24;--text:#f1f5f9;--muted:#94a3b8;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Arial,sans-serif;min-height:100vh}
header{background:linear-gradient(135deg,#1e3a8a,#7c3aed);padding:28px 32px 22px;text-align:center}
header h1{font-size:2.2em;color:#fff;font-weight:700}
header h1 span{color:var(--accent)}
header p{color:#c4b5fd;font-size:1em;margin-top:6px}

/* ── Letter buttons ── */
.groups-wrap{padding:24px 24px 8px;max-width:1100px;margin:auto}
.group-label{font-size:.75em;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 8px}
.group-label:first-child{margin-top:0}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.lbtn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:72px;height:72px;border-radius:12px;border:2px solid transparent;
  background:var(--surface);cursor:pointer;transition:all .18s;user-select:none;
  font-family:"Devanagari Sangam MN","Noto Sans Devanagari","Mangal",sans-serif;
}
.lbtn:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 4px 16px rgba(251,191,36,.25)}
.lbtn.active{background:var(--accent);color:#0f172a;border-color:var(--accent)}
.lbtn .hi{font-size:1.65em;line-height:1.15}
.lbtn .ro{font-size:.62em;color:var(--muted);font-family:"Segoe UI",Arial,sans-serif;letter-spacing:.02em}
.lbtn.active .ro{color:#78350f}

/* ── Word panel ── */
#panel{max-width:1100px;margin:0 auto;padding:0 24px 40px;display:none}
#panel-header{display:flex;align-items:baseline;gap:16px;padding:22px 0 16px}
#panel-letter{font-size:3.4em;font-family:"Devanagari Sangam MN","Noto Sans Devanagari","Mangal",sans-serif;color:var(--accent)}
#panel-title{font-size:1.3em;color:var(--muted)}
.cards-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:16px;
}
.wcard{
  background:var(--card);border-radius:var(--radius);overflow:hidden;
  transition:transform .15s;cursor:default;
}
.wcard:hover{transform:translateY(-4px)}
.wcard .img-wrap{width:100%;aspect-ratio:1;background:#1e293b;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wcard .img-wrap img{width:100%;height:100%;object-fit:cover}
.wcard .img-wrap .placeholder{font-size:3.8em;font-family:"Devanagari Sangam MN","Noto Sans Devanagari","Mangal",sans-serif;color:#334155}
.wcard .info{padding:10px 12px 12px}
.wcard .hi-word{font-size:1.25em;font-family:"Devanagari Sangam MN","Noto Sans Devanagari","Mangal",sans-serif;color:#f8fafc;font-weight:600}
.wcard .roman{font-size:.78em;color:var(--accent);margin-top:3px;font-style:italic}
.wcard .meaning{font-size:.82em;color:var(--muted);margin-top:4px}
</style>

// ─── Group colours for buttons ────────────────────────────────────────────
const GROUP_COLORS = [
  "#7c3aed","#1d4ed8","#0f766e","#b45309",
  "#b91c1c","#15803d","#6d28d9","#0369a1",
];

// ─── Build button groups ──────────────────────────────────────────────────
const container = document.getElementById("buttons");
let activeBtn = null;

DATA.forEach((grp, gi) => {
  const lbl = document.createElement("div");
  lbl.className = "group-label";
  lbl.textContent = grp.group;
  container.appendChild(lbl);

  const row = document.createElement("div");
  row.className = "btn-row";

  grp.letters.forEach(letter => {
    const btn = document.createElement("div");
    btn.className = "lbtn";
    btn.style.setProperty("--grp-color", GROUP_COLORS[gi % GROUP_COLORS.length]);
    btn.innerHTML = `<span class="hi">${letter.h}</span><span class="ro">${letter.r}</span>`;
    btn.addEventListener("click", () => showWords(letter, btn));
    row.appendChild(btn);
  });
  container.appendChild(row);
});

// ─── Show word panel ──────────────────────────────────────────────────────
function showWords(letter, btn) {
  if (activeBtn) activeBtn.classList.remove("active");
  if (activeBtn === btn) {
    activeBtn = null;
    document.getElementById("panel").style.display = "none";
    return;
  }
  activeBtn = btn;
  btn.classList.add("active");

  document.getElementById("panel-letter").textContent = letter.h;
  document.getElementById("panel-title").textContent =
    `· ${letter.r}  —  ${letter.words.length} word${letter.words.length > 1 ? "s" : ""}`;

  const grid = document.getElementById("cards");
  grid.innerHTML = "";

  letter.words.forEach(w => {
    const card = document.createElement("div");
    card.className = "wcard";

    const imgWrap = document.createElement("div");
    imgWrap.className = "img-wrap";
    if (w.img) {
      const img = document.createElement("img");
      img.src = w.img;
      img.alt = w.e;
      img.onerror = () => {
        imgWrap.innerHTML = `<span class="placeholder">${w.h[0]}</span>`;
      };
      imgWrap.appendChild(img);
    } else {
      imgWrap.innerHTML = `<span class="placeholder">${w.h[0]}</span>`;
    }

    const info = document.createElement("div");
    info.className = "info";
    info.innerHTML = `
      <div class="hi-word">${w.h}</div>
      <div class="roman">${w.r}</div>
      <div class="meaning">${w.e}</div>`;

    card.appendChild(imgWrap);
    card.appendChild(info);
    grid.appendChild(card);
  });

  const panel = document.getElementById("panel");
  panel.style.display = "block";
  panel.scrollIntoView({behavior:"smooth", block:"nearest"});
}
