<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Mitra AI Life logo option: Tall Orbit</title>
  <desc id="desc">AI oval with VIBGYOR orbit dots and black dot cluster.</desc>
  <defs>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="160" cy="160" r="108" fill="none" stroke="#2a3447" stroke-width="2.4" stroke-dasharray="4 11" opacity="0.34"/>

  <path d="M 74 35.4 Q 160 3.4 246 35.4" fill="none" stroke="#ff8a1f" stroke-width="9" stroke-linecap="round" opacity="0.96"/>
  <path d="M 74 284.6 Q 160 316.6 246 284.6" fill="none" stroke="#16a34a" stroke-width="9" stroke-linecap="round" opacity="0.96"/>

  <circle cx="114.0" cy="73.5" r="17.6" fill="#7c3aed" filter="url(#softGlow)"/><circle cx="188.7" cy="66.3" r="17.6" fill="#4f46e5" filter="url(#softGlow)"/><circle cx="246.5" cy="114.0" r="17.6" fill="#2563eb" filter="url(#softGlow)"/><circle cx="253.7" cy="188.7" r="17.6" fill="#22c55e" filter="url(#softGlow)"/><circle cx="206.0" cy="246.5" r="17.6" fill="#facc15" filter="url(#softGlow)"/><circle cx="131.3" cy="253.7" r="17.6" fill="#fb923c" filter="url(#softGlow)"/><circle cx="73.5" cy="206.0" r="17.6" fill="#ef4444" filter="url(#softGlow)"/>

  <circle cx="66.3" cy="131.3" r="18.5" fill="#111111" stroke="#f8fbff" stroke-opacity="0.78" stroke-width="2.2"/>
  <circle cx="34.3" cy="113.3" r="8.8" fill="#111111" stroke="#f8fbff" stroke-opacity="0.74" stroke-width="1.6"/>
  <circle cx="34.3" cy="149.3" r="8.8" fill="#111111" stroke="#f8fbff" stroke-opacity="0.74" stroke-width="1.6"/>

  <ellipse cx="160" cy="160" rx="76" ry="52" fill="#ffffff" stroke="#d6deea" stroke-width="3"/>
  <text x="160" y="174" text-anchor="middle" font-family="Syne, Nunito, Arial, sans-serif" font-size="42" font-weight="800" fill="#0f172a">AI</text>
</svg>
