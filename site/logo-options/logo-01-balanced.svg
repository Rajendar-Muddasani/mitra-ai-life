<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Mitra AI Life logo option: Balanced Orbit</title>
  <desc id="desc">AI oval with VIBGYOR orbit dots and black dot cluster.</desc>
  <defs>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="160" cy="160" r="111" fill="none" stroke="#2a3447" stroke-width="2.4" stroke-dasharray="3 10" opacity="0.32"/>

  <path d="M 74 32.2 Q 160 6.2 246 32.2" fill="none" stroke="#ff8a1f" stroke-width="10" stroke-linecap="round" opacity="0.96"/>
  <path d="M 74 287.8 Q 160 313.8 246 287.8" fill="none" stroke="#16a34a" stroke-width="10" stroke-linecap="round" opacity="0.96"/>

  <circle cx="106.5" cy="74.3" r="16.8" fill="#7c3aed" filter="url(#softGlow)"/><circle cx="182.7" cy="61.6" r="16.8" fill="#4f46e5" filter="url(#softGlow)"/><circle cx="245.7" cy="106.5" r="16.8" fill="#2563eb" filter="url(#softGlow)"/><circle cx="258.4" cy="182.7" r="16.8" fill="#22c55e" filter="url(#softGlow)"/><circle cx="213.5" cy="245.7" r="16.8" fill="#facc15" filter="url(#softGlow)"/><circle cx="137.3" cy="258.4" r="16.8" fill="#fb923c" filter="url(#softGlow)"/><circle cx="74.3" cy="213.5" r="16.8" fill="#ef4444" filter="url(#softGlow)"/>

  <circle cx="61.6" cy="137.3" r="16.8" fill="#111111" stroke="#f8fbff" stroke-opacity="0.78" stroke-width="2.2"/>
  <circle cx="27.6" cy="120.3" r="8.4" fill="#111111" stroke="#f8fbff" stroke-opacity="0.74" stroke-width="1.6"/>
  <circle cx="27.6" cy="154.3" r="8.4" fill="#111111" stroke="#f8fbff" stroke-opacity="0.74" stroke-width="1.6"/>

  <ellipse cx="160" cy="160" rx="80" ry="50" fill="#ffffff" stroke="#d6deea" stroke-width="3"/>
  <text x="160" y="174" text-anchor="middle" font-family="Syne, Nunito, Arial, sans-serif" font-size="42" font-weight="800" fill="#0f172a">AI</text>
</svg>
