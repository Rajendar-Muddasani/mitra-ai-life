<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Mitra AI Life logo option: No Lines</title>
  <desc id="desc">AI oval with VIBGYOR orbit dots and black dot cluster.</desc>
  <defs>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="160" cy="160" r="104" fill="none" stroke="#2a3447" stroke-width="2.4" stroke-dasharray="3 9" opacity="0.36"/>

  

  <circle cx="118.8" cy="75.5" r="17.6" fill="#7c3aed" filter="url(#softGlow)"/><circle cx="190.6" cy="71.1" r="17.6" fill="#4f46e5" filter="url(#softGlow)"/><circle cx="244.5" cy="118.8" r="17.6" fill="#2563eb" filter="url(#softGlow)"/><circle cx="248.9" cy="190.6" r="17.6" fill="#22c55e" filter="url(#softGlow)"/><circle cx="201.2" cy="244.5" r="17.6" fill="#facc15" filter="url(#softGlow)"/><circle cx="129.4" cy="248.9" r="17.6" fill="#fb923c" filter="url(#softGlow)"/><circle cx="75.5" cy="201.2" r="17.6" fill="#ef4444" filter="url(#softGlow)"/>

  <circle cx="71.1" cy="129.4" r="16.7" fill="#111111" stroke="#f8fbff" stroke-opacity="0.78" stroke-width="2.2"/>
  <circle cx="40.1" cy="113.4" r="8.8" fill="#111111" stroke="#f8fbff" stroke-opacity="0.74" stroke-width="1.6"/><circle cx="40.1" cy="145.4" r="8.8" fill="#111111" stroke="#f8fbff" stroke-opacity="0.74" stroke-width="1.6"/>

  <ellipse cx="160" cy="160" rx="78" ry="48" fill="#ffffff" stroke="#d6deea" stroke-width="3"/>
  <text x="160" y="174" text-anchor="middle" font-family="Syne, Nunito, Arial, sans-serif" font-size="42" font-weight="800" fill="#0f172a">AI</text>
</svg>
