<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Mitra AI Life logo option: Open Orbit</title>
  <desc id="desc">AI oval with VIBGYOR orbit dots and black dot cluster.</desc>
  <defs>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="160" cy="160" r="119" fill="none" stroke="#2a3447" stroke-width="2.4" stroke-dasharray="2 8" opacity="0.24"/>

  <path d="M 74 19.0 Q 160 -15.0 246 19.0" fill="none" stroke="#ff8a1f" stroke-width="10" stroke-linecap="round" opacity="0.96"/>
  <path d="M 74 301.0 Q 160 335.0 246 301.0" fill="none" stroke="#16a34a" stroke-width="10" stroke-linecap="round" opacity="0.96"/>

  <circle cx="92.9" cy="74.1" r="16.0" fill="#7c3aed" filter="url(#softGlow)"/><circle cx="173.3" cy="51.8" r="16.0" fill="#4f46e5" filter="url(#softGlow)"/><circle cx="245.9" cy="92.9" r="16.0" fill="#2563eb" filter="url(#softGlow)"/><circle cx="268.2" cy="173.3" r="16.0" fill="#22c55e" filter="url(#softGlow)"/><circle cx="227.1" cy="245.9" r="16.0" fill="#facc15" filter="url(#softGlow)"/><circle cx="146.7" cy="268.2" r="16.0" fill="#fb923c" filter="url(#softGlow)"/><circle cx="74.1" cy="227.1" r="16.0" fill="#ef4444" filter="url(#softGlow)"/>

  <circle cx="51.8" cy="146.7" r="16.8" fill="#111111" stroke="#f8fbff" stroke-opacity="0.78" stroke-width="2.2"/>
  <circle cx="13.8" cy="127.7" r="8.0" fill="#111111" stroke="#f8fbff" stroke-opacity="0.74" stroke-width="1.6"/>
  <circle cx="13.8" cy="165.7" r="8.0" fill="#111111" stroke="#f8fbff" stroke-opacity="0.74" stroke-width="1.6"/>

  <ellipse cx="160" cy="160" rx="84" ry="50" fill="#ffffff" stroke="#d6deea" stroke-width="3"/>
  <text x="160" y="174" text-anchor="middle" font-family="Syne, Nunito, Arial, sans-serif" font-size="42" font-weight="800" fill="#0f172a">AI</text>
