  <circle cx="110.0" cy="73.4" r="16.0" fill="#7c3aed" filter="url(#softGlow)"/><circle cx="185.9" cy="63.4" r="16.0" fill="#4f46e5" filter="url(#softGlow)"/><circle cx="246.6" cy="110.0" r="16.0" fill="#2563eb" filter="url(#softGlow)"/><circle cx="256.6" cy="185.9" r="16.0" fill="#22c55e" filter="url(#softGlow)"/><circle cx="210.0" cy="246.6" r="16.0" fill="#facc15" filter="url(#softGlow)"/><circle cx="134.1" cy="256.6" r="16.0" fill="#fb923c" filter="url(#softGlow)"/><circle cx="73.4" cy="210.0" r="16.0" fill="#ef4444" filter="url(#softGlow)"/>

  <circle cx="63.4" cy="134.1" r="16.0" fill="#111111" stroke="#f8fbff" stroke-opacity="0.78" stroke-width="2.2"/>
  <circle cx="30.4" cy="118.1" r="8.0" fill="#111111" stroke="#f8fbff" stroke-opacity="0.74" stroke-width="1.6"/><circle cx="30.4" cy="150.1" r="8.0" fill="#111111" stroke="#f8fbff" stroke-opacity="0.74" stroke-width="1.6"/>

  <ellipse cx="160" cy="160" rx="79" ry="49" fill="#ffffff" stroke="#d6deea" stroke-width="3"/>
